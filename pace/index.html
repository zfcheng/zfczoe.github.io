  function safeLoad(){try{const data=JSON.parse(localStorage.getItem(STORAGE));if(data&&data.version===1&&/^\d{4}-\d{2}-\d{2}$/.test(data.startDate))return{...stateDefault(),...data,logs:data.logs&&typeof data.logs==='object'?data.logs:{},checkins:data.checkins&&typeof data.checkins==='object'?data.checkins:{},exerciseProgress:data.exerciseProgress&&typeof data.exerciseProgress==='object'?data.exerciseProgress:{}}}catch(e){}return stateDefault()}
  let state=safeLoad(),page='home',selectedWeek=0,session=null,showExtra=false,toastHandle=0;
  let timerStart=0,timerElapsed=0,timerInterval=null,timerOn=false;

  function weekIndex(s){return Math.floor(daysBetween(state.startDate,s)/7)}

  function planForDate(s){const w=weekIndex(s);if(w<0||w>3)return null;const i=(asDate(s).getDay()+6)%7;return {...ROUTINE[i],date:s,week:w+1,minutes:ROUTINE[i].dur[w],optional:ROUTINE[i].category==='rest',id:s+'|'+ROUTINE[i].key}}

  function homeHtml(){const t=today(),w=weekIndex(t),active=w>=0&&w<4,displayWeek=weekNum(t),p=planForDate(t),log=logFor(t);const completion=planCompletion(displayWeek),target=TARGETS[displayWeek],aero=aerobicMins(displayWeek),check=state.checkins[t]||{},allCheckins=Object.values(state.checkins).filter(x=>x&&x.energy).map(x=>Number(x.energy)),avgEnergy=allCheckins.length?(allCheckins.reduce((a,b)=>a+b,0)/allCheckins.length).toFixed(1):'—';const before=daysBetween(t,state.startDate)>0;const after=w>3;

    const nextPlan=before?plannedFor(0)[0]:p;const display=nextPlan||plannedFor(3)[0];const kind=display?.category==='strength'?'strength':display?.category==='cardio'?'cardio':'rest';
    return `<div class="hero"><div class="hero-glow"></div><div class="hero-kicker">4 WEEK ENERGY RESET · ${after?'COMPLETE':before?'READY TO START':`WEEK ${w+1} OF 4`}</div><h1>${headline}</h1><p>${description}</p><button class="btn primary" data-action="${before||after?'tab':'open'}" ${before||after?'data-tab="plan"':`data-date="${p?.date||state.startDate}"`}>${before?'先看看训练安排':after?'回顾训练计划':log?'查看训练记录':'查看今天安排'} &nbsp; →</button><div class="hero-progress"><div class="bar-track dark"><div class="bar-fill" style="width:${Math.round(Math.min(100,completion/5*100))}%"></div></div><div style="font-size:11px;color:#b9d7cc;margin-top:8px">${active?'本周计划':before?'首周计划':'第4周计划'} · ${completion}/5 项已完成</div></div></div>

      <div class="layout2"><div class="panel"><div class="section-head"><h2 class="panel-title">${before?'即将开始的训练':after?'最近一次计划':'今日运动'}</h2><span class="tag ${log?'success':display?.optional?'gray':''}">${log?'✓ 已完成':before?'即将开始':display?.optional?'恢复日':display?.at+' · 建议'}</span></div><div class="workout-head"><div class="workout-icon ${kind}">${icon(kind==='strength'?'dumbbell':kind==='cardio'?'walk':'leaf',27)}</div><div><h3>${display?.title||'自由活动'}</h3><p>${escapeHtml(display?.details||'')}</p></div></div><div class="workout-meta"><span class="meta">${icon('clock',13)} <b>${display?.minutes||'灵活'}</b> ${display?.minutes?'分钟':'安排'}</span><span class="meta">${icon('sun',13)} ${display?.at||'—'}</span><span class="meta">${display?.category==='strength'?'基础力量':display?.category==='cardio'?'低至中强度':'休息与恢复'}</span></div><div class="session-advice">${display?.category==='strength'?'训练前先热身。第1周各动作1组，熟悉之后再增加组数，动作始终优先于重量。':display?.category==='cardio'?'用“谈话测试”判断强度：呼吸略快，但可以完整说话；不追求配速。':'休息也是训练的一部分。每坐45～60分钟起身活动2～5分钟。'}</div><div class="btn-row"><button class="btn dark" data-action="open" data-date="${display?.date||state.startDate}">${log?'查看 / 修改记录':display?.optional?'查看恢复建议':'开始 / 记录训练'}</button><button class="btn light" data-action="tab" data-tab="plan">完整4周计划</button></div></div>
      <div class="panel"><div class="section-head"><h2 class="panel-title">今日状态</h2><span class="tag gray">每日 30 秒</span></div><label class="form-label">今天的精力怎么样？</label><div class="checkin-energies" id="energy-buttons">${[1,2,3,4,5].map(n=>`<button class="energybtn ${Number(check.energy)===n?'selected':''}" data-action="energy" data-energy="${n}" aria-label="精力 ${n} 分" title="${n}分">${ENERGY[n]}</button>`).join('')}</div><div class="form-grid"><div><label class="form-label" for="sleep-input">昨晚睡眠（小时）</label><input class="field" id="sleep-input" type="number" min="0" max="16" step="0.5" inputmode="decimal" placeholder="例如 7.5" value="${check.sleep??''}"></div><div><label class="form-label" for="steps-input">今日步数（可选，参考 ${state.stepGoal.toLocaleString('zh-CN')}）</label><input class="field" id="steps-input" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="例如 6200" value="${check.steps??''}"></div></div><div style="margin:14px 0"><label class="form-label" for="checkin-note">一句话记录（可选）</label><input class="field" id="checkin-note" type="text" maxlength="160" placeholder="例如：下午比昨天有精神" value="${escapeHtml(check.note||'')}"></div><button class="btn dark" data-action="save-checkin" style="width:100%">保存今日状态</button><p class="hint" style="margin:10px 0 0">精力从1到5分，5分代表最充沛；数据仅保存在当前浏览器。</p></div></div>

  function planHtml(){let w=selectedWeek;const sessions=plannedFor(w),start=add(state.startDate,w*7),end=add(start,6);return `<div class="eyebrow">YOUR 4-WEEK ROUTINE</div><h1 style="font-size:32px;letter-spacing:-1px;margin:8px 0 5px">四周，循序渐进</h1><p class="section-desc">有氧训练提升心肺耐力；轻量力量训练帮助改善日常体力。从小运动量开始，不必一口气完成所有目标。</p><div class="week-tabs">${[0,1,2,3].map(i=>`<button class="week-tab ${w===i?'active':''}" data-action="week" data-week="${i}">第 ${i+1} 周</button>`).join('')}</div><div class="plan-cols"><div class="panel"><div class="section-head"><div><h2 class="panel-title">第 ${w+1} 周训练表</h2><div class="subtle tiny" style="margin-top:4px">${shortDate(start)} — ${shortDate(end)}</div></div><span class="tag">有氧目标 ${TARGETS[w]} 分钟</span></div><div class="schedule-list">${sessions.map((p,i)=>`<div class="schedule-item ${logFor(p.date)?'done':''}"><div class="schedule-date">${DAY[i]}<strong>${asDate(p.date).getDate()}</strong></div><div class="circle-icon ${p.category}">${icon(p.category==='strength'?'dumbbell':p.category==='cardio'?'walk':'leaf',19)}</div><div class="schedule-content"><strong>${p.title}</strong><p>${p.at} · ${p.minutes?p.minutes+'分钟':'自由安排'}${p.category==='strength'?' · 器械＋组间计时':''} ${logFor(p.date)?' · ✓ 已完成':''}</p></div><button class="open-session" data-action="open" data-date="${p.date}">${logFor(p.date)?'记录':p.category==='strength'?'详情 · 视频':'详情'}</button></div>`).join('')}</div></div><div><div class="panel"><div class="section-head"><h2 class="panel-title">本周训练重点</h2></div>${[["有氧目标",`每周约 ${TARGETS[w]} 分钟。舒适快走，保持能够完整说话的强度。`],["力量节奏",w===0?'每个动作先做1组，掌握技术与动作幅度。':'每个动作逐步增加至2组，每组8～12次，量力而行。'],["进阶原则",'先增加运动时间，再考虑速度或重量；疲劳或睡眠不足时可以主动降量。'],["工作与家庭",'中午留给孩子；20:00之后不安排强制训练。']].map((t,i)=>`<div class="plan-sidebar-item"><b><span class="numbered">${i+1}</span>${t[0]}</b><p>${t[1]}</p></div>`).join('')}</div><div class="panel section-space"><h3 class="panel-title">今天也能做的小事</h3><p class="section-desc" style="margin:10px 0 0">每坐45～60分钟，起身走动2～5分钟。连续久坐的中断，比单纯凑步数更容   function reviewHtml(){const all=logs(),strength=all.filter(x=>x.category==='strength'&&x.kind!=='extra').length,totalAero=recordedCardio(),pastDays=Object.keys(state.checkins).sort().slice(-7),energies=pastDays.map(d=>({date:d,value:Number(state.checkins[d].energy)||0}));const weeklyRows=[0,1,2,3].map(w=>({w,actual:aerobicMins(w),goal:TARGETS[w],count:planCompletion(w)}));const completedWeeks=weeklyRows.filter(x=>x.count===5).length;return `<div class="eyebrow">YOUR PROGRESS, YOUR PACE</div><h1 style="font-size:32px;letter-spacing:-1px;margin:8px 0 5px">看见一点点进步</h1><p class="section-desc">不需要跟别人比较。重点观察：同样的快走是否更轻松、下午精力是否变好、运动后恢复是否更快。</p><div class="stats"><div class="stat"><div class="caption">累计有氧训练</div><strong>${totalAero}<em>分钟</em></strong><small>4周内已记录</small></div><div class="stat"><div class="caption">累计力量训练</div><strong>${strength}<em>次</em></strong><small>计划共8次</small></div><div class="stat"><div class="caption">已完整完成周数</div><strong>${completedWeeks}<em>/ 4周</em></strong><small>以每周5项计划计算</small></div><div class="stat"><div class="caption">状态记录天数</div><strong>${Object.keys(state.checkins).length}<em>天</em></strong><small>用来观察精力变化</small></div></div><div class="review-grid"><div class="panel"><div class="section-head"><h2 class="panel-title">每周有氧分钟数</h2><span class="tag gray">实际 vs 计划</span></div><div class="chart-legend"><span><i class="legend-mark" style="background:#2a8278"></i>已完成</span><span><i class="legend-mark" style="background:#e9ede4;border:1px dashed #c0d5bf"></i>目标</span></div><div class="chart">${weeklyRows.map(x=>{const actualHeight=Math.min(100,x.actual/120*100),goalHeight=x.goal/120*100;return `<div class="chart-col"><div class="chart-val">${x.actual} / ${x.goal}</div><div class="chart-bar-outer"><div class="chart-goal" style="height:${goalHeight}%"></div><div class="chart-actual ${x.actual?'':'no-data'}" style="height:${actualHeight}%"></div></div><strong>第${x.w+1}周</strong></div>`}).join('')}</div><p class="hint" style="margin-top:19px">“ in('')}</div>`:`<div class="muted-state"><strong>还没有运动记录</strong>完成第一次训练后，记录会显示在这里。</div>`}</div>`}
  function settingsHtml(){return `<div class="eyebrow">YOUR DATA, IN YOUR HANDS</div><h1 style="font-size:32px;letter-spacing:-1px;margin:8px 0 5px">设置与数据</h1><p class="section-desc">完全离线，无需注册或联网。运动数据保存在当前浏览器，建议定期导出备份。</p><div class="settings-grid"><div class="panel"><h2 class="panel-title">你的计划</h2><div class="setting-row"><label>添加到手机桌面</label><p class="hint">需要从 HTTPS 地址在 iPhone Safari 中安装。安装后像普通 App 一样从主屏幕打开，加载过的资源可离线使用。</p><button class="btn light" data-action="install-help">查看安装步骤</button></div><div class="setting-row"><label for="start-date">4周计划的开始日期</label><input class="field" id="start-date" type="date" value="${state.startDate}"><p class="hint">自动对齐所选日期所在周的周一；调整开始日期不会删除历史记录。</p></div><div class="setting-row"><label for="step-goal">每日步数参考目标</label><input class="field" id="step-goal" type="number" min="2000" max="30000" step="500" value="${state.stepGoal}"><p class="hint">起步可先设 6,000，逐步提高；不必每天达标。</p></div><div class="setting-row"><button class="btn dark" data-action="save-settings">保存设置</button></div><div class="line"></div><h2 class="panel-title">数据备份</h2><p class="section-desc">更换电脑、清理浏览器缓存前，先导出 JSON 备份文件。</p><div class="data-actions"><button class="btn light" data-action="export-data">${icon('download',16)} 导出备份</button><button class="btn outline" data-action="import-data">导入备份</button></div><div class="setting-row"><label>日历提醒</label><p class="hint">可导出4周工作日训练到系统日历；不自动添加，需手动导入。</p><button class="btn light" data-action="export-ics">${icon('plan',16)} 导出 .ics 日历</button></div><div class="setting-row"><label>清除本地记录</label><p class="hint">会清空打卡与状态记录，但保留当前开始日期。此操作无法撤销。</p><button class="btn danger" data-action="clear">清空记录</button></div></div><div><div class="panel"><h2 class="panel-title">为什么这样安排？</h2><div class="privacy-list"><b>09:10 · 早间轻有氧</b><br>早餐较少且结束不久，先安排轻到中等强度快走，注意身体感受。<br><br><b>17:30 · 傍晚力量</b><br>和早餐错开，训练后安排晚饭。饥饿时可在16:30适当加餐。<br><br><b>20:00后 · 弹性恢复</b><br>不强制补练，优先家人、休息与睡眠。<br><br><b>每周进阶 · 宁慢勿急</b><br>有氧从50分钟逐步增至100分钟；再向每周150分钟靠近。</div></div><div class="panel section-space"><h2 class="panel-title">隐私说明</h2><p class="section-desc" style="margin:12px 0 0">本应用不需要服务器、不向外发送数据、不调用分析服务。数据依赖浏览器本地存储；换浏览器或使用无痕模式，数据可能不会保留。请使用“导出备份”保存副本。</p></div></div></div>`}
  function openSession(s){let p=planForDate(s);if(!p)return toast('此日期不在当前4周计划内');showExtra=false;session=p;openModal()}

  function stopTimer(){if(timerOn){timerElapsed+=Date.now()-timerStart;timerOn=false}if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
  function resetTimer(){stopTimer();timerElapsed=0;updateTimer()}
  function updateTimer(){const el=document.getElementById('timer-count');if(!el)return;const s=Math.max(0,Math.floor((timerElapsed+(timerOn?Date.now()-timerStart:0))/1000));el.textContent=`${fmt2(Math.floor(s/60))}:${fmt2(s%60)}`;const btn=document.getElementById('timer-toggle');if(btn)btn.textContent=timerOn?'暂停计时':'开始计时'}
  function openModal(){stopTimer();stopRest();timerElapsed=0;const p=session;const prev=state.logs[p.id];const isExtra=showExtra;const kind=p.category;const weekNumx=p.week||1;const sets=weekNumx<=1?'每个动作先做 1 组':'每个动作根据状态逐渐增加到 2 组';document.getElementById('modal-content').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${shortDate(p.date)} · ${isExtra?'自由记录':'第'+weekNumx+'周'}</div><h2 id="modal-session-title">${p.title}</h2></div><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><p class="subtle" style="margin:9px 0 0">${escapeHtml(p.details)}</p><div class="session-steps"><strong style="font-size:13px">${kind==='strength'?'训练内容 · '+sets:kind==='cardio'?'有氧指导':'恢复建议'}</strong>${kind==='strength'&&EQUIPMENT[p.key]?equipmentWorkoutHtml(p):`<ol>${p.steps.map(t=>`<li>${escapeHtml(t)}${guideButtons(t)}</li>`).join('')}</ol>`}</div><div class="timer"><div class="eyebrow">SESSION TIMER / 训练计时器</div><div class="timer-count" id="timer-count">00:00</div><div class="timer-actions"><button class="btn dark sm" data-action="timer-toggle" id="timer-toggle">开始计时</button><button class="btn outline sm" data-action="timer-fill">填入分钟数</button><button class="btn outline sm" data-action="timer-reset">重置</button></div><div class="hint" style="margin-top:7px">计时器需保持页面打开；切到后台请以实际训练时间为准。</div></div><div class="form-grid"><div><label class="form-label" for="log-minutes">实际运动时间（分钟）</label><input type="number" class="field" id="log-minutes" min="0" max="480" inputmode="numeric" value="${prev?.minutes??p.minutes}"></div><div><label class="form-label" for="log-effort">主观强度</label><select class="field" id="log-effort"><option value="easy" ${prev?.effort==='easy'?'selected':''}>轻松</option><option value="moderate" ${!prev?.effort||prev.effort==='moderate'?'selected':''}>有点累，还能说话</option><option value="hard" ${prev?.effort==='hard'?'selected':''}>偏累</option></select></div></div>${isExtra?`<div style="margin:12px 0"><label class="form-label" for="extra-date">运动日期</label><input class="field" type="date" id="extra-date" value="${p.date}"></div>`:''}<div><label class="form-label" for="log-notes">训练感受（可选）</label><textarea class="field" id="log-notes" maxlength="250" placeholder="例如：今天快走20分钟，呼吸更稳了。">${escapeHtml(prev?.note||'')}</textarea></div><div class="modal-actions">${prev&&!isExtra?'<button class="btn danger" data-action="delete-log">撤销完成</button>':''}<button class="btn outline" data-action="close">取消</button><button class="btn dark" data-action="save-log">${isExtra?'保存活动':'保存训练记录'}</button></div>`;
    document.getElementById('session-overlay').classList.remove('hidden');document.body.style.overflow='hidden';updateTimer();setTimeout(()=>document.querySelector('.modal-close')?.focus(),50)}
  function closeModal(){stopTimer();stopRest();document.getElementById('session-overlay').classList.add('hidden');document.body.style.overflow='';session=null;showExtra=false}
  function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function exportICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PACE Offline//Workout Calendar//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:节律 PACE · 4周运动计划'];const pad=s=>s.replace(/-/g,'');for(let w=0;w<4;w++){for(let i of [0,1,3,4]){const p=plannedFor(w)[i];const [hr,min]=p.at.split(':').map(Number);const dt=asDate(p.date);dt.setHours(hr,min,0,0);const end=new Date(dt.getTime()+p.minutes*60000);const stamp=d=>iso(d).replace(/-/g,'')+'T'+fmt2(d.getHours())+fmt2(d.getMinutes())+'00';const clean=s=>s.replace(/[\\;,\r\n]/g,' ');lines.push('BEGIN:VEVENT','UID:pace-'+pad(p.date)+'-'+p.key+'@local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z'),'DTSTART:'+stamp(dt),'DTEND:'+stamp(end),'SUMMARY:'+clean('节律 · '+p.title),'DESCRIPTION:'+clean(p.details+'；运动以身体感受为准'),'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:运动时间到了','END:VALARM','END:VEVENT')}}lines.push('END:VCALENDAR');downloadFile('PACE-4周训练日历.ics',lines.join('\r\n'),'text/calendar;charset=utf-8')}
  function saveCheckin(){const t=today();const energy=Number(document.querySelector('.energybtn.selected')?.dataset.energy||0),sleepStr=document.getElementById('sleep-input').value,stepsStr=document.getElementById('steps-input').value,sleep=sleepStr===''?null:Number(sleepStr),steps=stepsStr===''?null:Number(stepsStr);if(sleep!==null&&(!Number.isFinite(sleep)||sleep<0||sleep>16))return toast('睡眠请输入0～16小时');if(steps!==null&&(!Number.isInteger(steps)||steps<0||steps>100000))return toast('步数请输入合理的整数');const note=document.getElementById('checkin-note').value.trim().slice(0,160);if(!energy&&sleep===null&&steps===null&&!note)return toast('先选择精力或填写一项状态');state.checkins[t]={energy,sleep,steps,note,updatedAt:new Date().toISOString()};save();render();toast('今日状态已保存')}
  function saveLog(){const p=session,isExtra=showExtra;const n=Number(document.getElementById('log-minutes').value),effort=document.getElementById('log-effort').value,note=document.getElementById('log-notes').value.trim().slice(0,250);if(!Number.isInteger(n)||n<0||n>480)return toast('运动时间请输入0～480之间的整数');if(n===0&&!p.optional)return toast('实际完成训练请填写大于0分钟');const date=isExtra?document.getElementById('extra-date').value:p.date;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('请选择有效日期');const id=isExtra?'extra|'+Date.now()+'|'+Math.random().toString(36).slice(2,7):p.id;state.logs[id]={id,date,kind:isExtra?'extra':'planned',category:p.category,title:p.title,minutes:n,effort,note,done:true,savedAt:new Date().toISOString()};save();closeModal();render();toast('训练记录已保存在本机')}
  function saveSettings(){const raw=document.getElementById('start-date').value,step=Number(document.getElementById('step-goal').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(raw))return toast('请选择有效的开始日期');if(!Number.isInteger(step)||step<2000||step>30000)return toast('步数目标请设在2,000～30,000之间');const aligned=monday(raw);state.startDate=aligned;state.stepGoal=step;save();selectedWeek=0;render();toast(raw===aligned?'设置已保存':'已自动对齐该周周一')}
  function importData(file){if(!file)return;if(file.size>2*1024*1024)return toast('备份文件不能超过2MB');const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result));if(obj.version!==1||!/^\d{4}-\d{2}-\d{2}$/.test(obj.startDate)||typeof obj.logs!=='object'||!obj.logs||Array.isArray(obj.logs)||typeof obj.checkins!=='object'||!obj.checkins||Array.isArray(obj.checkins))throw Error('无效备份');if(!confirm('导入备份将覆盖当前设备上的所有记录。确定继续吗？'))return;state={...stateDefault(),...obj};save();selectedWeek=0;setPage('home');toast('备份导入成功')}catch(e){toast('导入失败：文件不是有效的PACE备份')}};reader.readAsText(file)}
  document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;const act=button.dataset.action;if(act==='tab')setPage(button.dataset.tab);else if(act==='week'){selectedWeek=Number(button.dataset.week);render()}else if(act==='open')openSession(button.dataset.date);else if(act==='extra')extraSession();else if(act==='equip-set')toggleEquipSet(button);else if(act==='rest-start')beginRest(button.dataset.seconds,button.dataset.restLabel);else if(act==='rest-stop'){stopRest();tickRest();const m=document.getElementById('rest-status');if(m)m.textContent='已停止，可重新选择时间';}else if(act==='play-guide'){const g=VIDEO_GUIDES.find(x=>x.id===button.dataset.video),slot=button.nextElementSibling;if(g&&slot){const opening=!slot.innerHTML;slot.innerHTML=opening?demoVideo(g):'';button.textContent=opening?'收起视频':'▶ 看视频演示';button.setAttribute('aria-expanded',opening?'true':'false')}}else if(act==='close')closeModal();else if(act==='timer-toggle'){if(timerOn)stopTimer();else{timerStart=Date.now();timerOn=true;timerInterval=setInterval(updateTimer,300)}updateTimer()}else if(act==='timer-fill'){const elapsed=timerElapsed+(timerOn?Date.now()-timerStart:0);const minutes=Math.ceil(elapsed/60000);if(minutes>0){document.getElementById('log-minutes').value=String(minutes);toast('已填入计时分钟数')}else toast('请先开始计时')}else if(act==='timer-reset')resetTimer();else if(act==='save-log')saveLog();else if(act==='delete-any'){const id=button.dataset.id;if(state.logs[id]&&confirm('确定删除这条运动记录吗？')){delete state.logs[id];save();render();toast('已删除记录')}}else if(act==='delete-log'){if(session&&!showExtra&&confirm('确定撤销这次训练记录吗？')){delete state.logs[session.id];save();closeModal();render();toast('已撤销训练记录')}}else if(act==='energy'){document.querySelectorAll('.energybtn').forEach(x=>x.classList.remove('selected'));button.classList.add('selected')}else if(act==='save-checkin')saveCheckin();else if(act==='save-settings')saveSettings();else if(act==='export-data'){downloadFile('PACE-运动数据备份-'+today()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('已生成本地备份文件')}else if(act==='import-data')document.getElementById('import-file').click();else if(act==='export-ics'){exportICS();toast('已生成4周日历文件')}else if(act==='install-help'){showInstallGuide(true)}else if(act==='install-app'){installApp()}else if(act==='install-dismiss'){dismissInstallGuide()}else if(act==='clear'){if(confirm('确定清空全部运动打卡和精力记录吗？此操作不可撤销。')){state.logs={};state.checkins={};state.exerciseProgress={};save();render();toast('记录已清空')}}});
  document.getElementById('import-file').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});
  document.getElementById('session-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('session-overlay'))closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('session-overlay').classList.contains('hidden'))closeModal()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateTimer();tickRest()}});

  // Install assistant. Native PWA installation depends on Safari/Chrome and an HTTPS origin.
  let deferredInstallPrompt=null;
  const installGuide=document.getElementById('install-guide');
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isSafari=/Safari/i.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(navigator.userAgent);
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  const isHttps=location.protocol==='https:';
  function dismissInstallGuide(){try{localStorage.setItem('pace-pwa-guide-dismissed-v2','yes')}catch(e){}installGuide.classList.add('hidden')}
  function showInstallGuide(force=false){
    if(isStandalone()){installGuide.classList.add('hidden');if(force)toast('已从主屏幕启动，无需再次安装');return}
    if(!force){try{if(localStorage.getItem('pace-pwa-guide-dismissed-v2')==='yes')return}catch(e){}}
    let instructions='', sub='';
    if(!isHttps && !['localhost','127.0.0.1'].includes(location.hostname)){
      instructions='<span class="install-guide-step">1. 将整份 PWA 文件上传到 HTTPS 网站</span><span class="install-guide-step">2. 手机 Safari 打开网址</span><span class="install-guide-step">3. 分享 → 添加到主屏幕</span>';
      sub='目前打开的是本地文件或非安全网址，无法直接作为支持离线缓存的 iPhone 网页 App 安装。下载包里的《iPhone安装指南》提供了免费部署方式。';
    }else if(isIOS&&isSafari){
      instructions='<span class="install-guide-step">① Safari 下方“分享”图标</span><span class="install-guide-step">② 添加到主屏幕</span><span class="install-guide-step">③ 点击“添加”</span>';
      sub='添加后，直接点击桌面「节律 PACE」图标使用。首次请在联网状态下打开，等待网页加载完成，再尝试离线使用。';
    }else if(isIOS){
      instructions='<span class="install-guide-step">① 复制当前网址</span><span class="install-guide-step">② 使用 Safari 打开</span><span class="install-guide-step">③ 分享 → 添加到主屏幕</span>';
      sub='iPhone 建议使用 Safari 安装，以获得最稳定的主屏幕网页 App 体验。';
    }else if(deferredInstallPrompt){
      instructions='<button class="btn dark sm" type="button" data-action="install-app">安装节律 PACE 到设备</button>';
      sub='安装后可以从桌面打开，训练记录保留在本机。';
    }else{
      instructions='<span class="install-guide-step">浏览器菜单 → 安装应用 / 添加到主屏幕</span>';
      sub='如果看不到安装选项，请确认网页通过 HTTPS 打开，并且使用支持 PWA 的浏览器。';
    }
    installGuide.innerHTML='<div class="install-guide-head"><strong>📲 把「节律 PACE」放到手机桌面</strong><button class="install-guide-close" type="button" data-action="install-dismiss" aria-label="关闭安装说明">稍后 ×</button></div><p>'+sub+'</p><div class="install-guide-steps">'+instructions+'</div>';
    installGuide.classList.remove('hidden');
    if(force){installGuide.scrollIntoView({behavior:'smooth',block:'start'})}
  }
  function installApp(){
    if(!deferredInstallPrompt){showInstallGuide(true);return}
    const prompt=deferredInstallPrompt;deferredInstallPrompt=null;
    prompt.prompt();prompt.userChoice.then(({outcome})=>{if(outcome==='accepted')installGuide.classList.add('hidden')}).catch(()=>{});
  }
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;showInstallGuide()});
  window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installGuide.classList.add('hidden')});
  showInstallGuide();
  render();
  // Installable when served from localhost or HTTPS; standalone HTML still works offline.
  if ("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")) {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
  // Expose a tiny, read-only readiness marker for offline smoke tests.
  window.PACE_READY=true;
})();
</script>
