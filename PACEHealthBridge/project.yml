name: PACEHealthBridge
options:
  bundleIdPrefix: ai.pace
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  PACEHealthBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PACEHealthBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pace.healthbridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PACEHealthBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: PACEHealthBridge/PACEHealthBridge.entitlements
    dependencies:
      - sdk: HealthKit.framework
